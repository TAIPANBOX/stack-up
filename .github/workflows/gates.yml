# See the note in the sibling repos: these checks used to run only through
# .githooks/pre-push, which is local configuration and does not travel with a
# clone. The scripts here are the ONE copy; the hook and this workflow both
# call them. Public repo, so standard runners cost nothing.
name: gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: shellcheck up.sh down.sh routines.sh

      - name: the scripts parse
        run: bash -n up.sh && bash -n down.sh && bash -n routines.sh

      - name: every port stays on loopback
        run: ./scripts/loopback-only.sh

      - name: one trust domain, and the seal refuses before it consumes
        run: ./scripts/one-trust-domain.sh

      - name: every gateway start names its upstream
        run: ./scripts/gateway-decides-its-upstream.sh

      - name: every gateway start turns the semantic cache off
        run: ./scripts/gateway-cache-is-off.sh

      - name: every gateway start gets a per-run declassify key, in its environment only
        run: ./scripts/declassify-is-keyed.sh

      - name: the revocation key is never logged
        run: ./scripts/revoke-key-not-printed.sh

      - name: the typed-answers data mode is chosen, refused early, and the key file is never read
        run: ./scripts/typed-mode.sh

      - name: every gateway start sets the run-budget ceiling, and the flag refuses what the gateway refuses
        run: ./scripts/run-budget-ceiling-is-set.sh

      - name: every stream file is one the readers accept as the source it carries
        run: ./scripts/bus-files-match-sources.sh

      - name: the chain-verify routine never calls a standing break ok
        run: ./scripts/chain-verify-routine.sh

      - name: components.json says what this launcher installs
        run: ./scripts/manifest-is-true.sh

      - name: every scenario is bound to a case that exists
        run: ./scripts/features-are-bound.sh

      # Last, because it mutates tracked files and restores them. It needs a
      # clean tree and says so plainly, so it also reports any earlier step
      # that starts writing into the checkout.
      - name: the gate above can still fail
        run: ./scripts/gates-have-teeth.sh
